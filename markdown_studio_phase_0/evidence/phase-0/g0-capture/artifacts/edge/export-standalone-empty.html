<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>welcome.md</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
  }
  body {
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
    color: #e2e8f0;
    background: #0f172a;
  }
  pre {
    background: #1e293b;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #334155;
    color: #f1f5f9;
    overflow-x: auto;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.9em;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 1.5em 0;
  }
  th, td {
    border: 1px solid #334155;
    padding: 8px 12px;
  }
  th {
    background: #1e293b;
  }
  img {
    max-width: 100%;
    height: auto;
  }
  blockquote {
    border-left: 4px solid #818cf8;
    margin: 1.5em 0;
    padding-left: 16px;
    color: #94a3b8;
  }
  .mermaid-block-card {
    margin: 1.5em 0;
    border: none !important;
    background: transparent !important;
  }
  .mermaid-viewport {
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: visible !important;
    max-height: none !important;
    padding: 0 !important;
    background: none !important;
  }
  .mermaid-canvas {
    transform: none !important;
    max-width: 100%;
    text-align: center;
  }
  .mermaid-canvas svg {
    max-width: 100% !important;
    height: auto !important;
    display: block;
    margin: 0 auto;
  }
  .mermaid-header, .mermaid-actions, .diag-action-btn, .mermaid-raw-code {
    display: none !important;
  }
  mjx-container {
    overflow-x: auto;
    max-width: 100%;
  }
</style>
</head>
<body>

</body>
</html>
